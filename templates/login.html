{% extends "base.html" %}

{% block title %}Login - FaceSecure{% endblock %}

{% block content %}
<div class="auth-box card">
  <div class="auth-header">
    <div style="font-size: 3rem; margin-bottom: 0.5rem;">🔑</div>
    <h2 class="auth-title">Welcome Back</h2>
    <p style="color: var(--text-secondary);">Enter your email & password to manage access control</p>
  </div>

  <form method="POST" action="{{ url_for('login') }}">
    <div class="form-group">
      <label class="form-label">Admin Email Address</label>
      <input type="email" name="email" class="form-input" placeholder="admin@facesecure.com" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-input" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
      🚀 Log In
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
    Don't have an admin account? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600;">Sign Up</a>
  </div>
</div>
{% endblock %}
